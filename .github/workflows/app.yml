name: app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bff
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  web-a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    env:
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DOCS_URL: http://localhost:3001
      CONTACT_EMAIL: hello@example.com
      NEXT_PUBLIC_CONTACT_EMAIL: hello@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:a11y

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Missing secrets must never fail the job: the suite skips every test on an empty
      # environment, and the job says so before anything else runs.
      - name: Check the E2E secrets
        id: cfg
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_MCP_URL: ${{ secrets.E2E_MCP_URL }}
        run: |
          set -euo pipefail
          configured=false
          if [ -n "${E2E_EMAIL:-}" ] && [ -n "${E2E_PASSWORD:-}" ]; then configured=true; fi
          if [ -n "${E2E_MCP_URL:-}" ]; then configured=true; fi
          if [ "$configured" = false ]; then
            echo "skipped: no E2E secrets — set E2E_EMAIL, E2E_PASSWORD, E2E_WA_NUMBER, E2E_MCP_URL (secrets) and E2E_BASE_URL (variable) to run the journey."
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Resolve the Vercel preview URL
        id: preview
        if: steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
          OVERRIDE: ${{ vars.E2E_BASE_URL }}
        run: |
          set -euo pipefail
          url="${OVERRIDE:-}"
          if [ -z "$url" ]; then
            dep=$(gh api "repos/$REPO/deployments?ref=$SHA&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)
            [ -n "$dep" ] || dep=$(gh api "repos/$REPO/deployments?ref=$REF&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)
            if [ -n "${dep:-}" ]; then
              url=$(gh api "repos/$REPO/deployments/$dep/statuses?per_page=1" --jq '.[0].environment_url // empty' 2>/dev/null || true)
            fi
          fi
          if [ -n "${url:-}" ]; then
            echo "Preview URL: $url"
            echo "base_url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "skipped: no deployment URL — set the E2E_BASE_URL repository variable (or push a Vercel preview for this branch)."
          fi

      # The browser is only needed by tests that actually run.
      - name: Install Chromium
        if: steps.cfg.outputs.configured == 'true' && steps.preview.outputs.base_url != ''
        run: bunx playwright install --with-deps chromium

      # No secrets → the seven journey tests all report "skipped: no E2E secrets" and exit 0;
      # secrets but no URL → nothing to test against, so the run step is skipped instead.
      - name: Run the Playwright journey
        id: journey
        if: steps.cfg.outputs.configured == 'false' || steps.preview.outputs.base_url != ''
        env:
          BASE_URL: ${{ steps.preview.outputs.base_url || 'http://localhost:3000' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_WA_NUMBER: ${{ secrets.E2E_WA_NUMBER }}
          E2E_MCP_URL: ${{ secrets.E2E_MCP_URL }}
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() && steps.journey.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  bff-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/bff-smoke

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: scripts/stack-check
