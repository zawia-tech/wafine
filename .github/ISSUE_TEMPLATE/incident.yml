name: Incident / bug
description: Something is broken or behaving unexpectedly (VM, OpenWA, Supabase, Tailscale, Cloudflare)
labels: ["bug"]
assignees: ["moughamir"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["OCI VM / network", "OpenWA container", "WhatsApp session", "Supabase DB / storage", "Tailscale", "Cloudflare", "Scripts / IaC", "Other"]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["down — nothing works", "degraded", "minor / cosmetic"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, what you expected
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence (redacted)
      description: "Commands and output, e.g. `./stack/wa ps`, `./stack/wa logs --tail=100 openwa-api`, `./stack/preflight.sh`. Redact keys, passwords, tokens, phone numbers."
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: Logs above are redacted — no secrets, API keys, QR codes or personal phone numbers
          required: true
